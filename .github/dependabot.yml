version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Skip freshly published versions: compromised releases are usually pulled within days.
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Node types follow the runtime used in CI (Node 24), not the latest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
